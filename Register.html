<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="Style.css">
  <link rel="icon" href="./Images/monika-grabkowska-mha2dvydACg-unsplash.jpg" type="image/icon">  
  <link href='https://fonts.googleapis.com/css?family=Aboreto' rel='stylesheet'>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script defer src="User.js"></script>
  <script defer src="Register.js"></script>
</head>
<body id="Credentials-Body">
  <header>
    <h1>Enter register information</h1> 
  </header>
  <main>
    <nav>
      <a class="nav-link" href="List.html">List</a>
      <a class="nav-link" href="Login.html">Login</a>
    </nav>
    <div class="box">
      <form id="registerForm">
        <div class="input">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="fname" name="fname" placeholder="First Name"><br>
        </div>
        <div class="input">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="lname" name="lname" placeholder="Last Name"><br>
        </div>
        <div class="input">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="uname" name="uname" placeholder="Username"><br>
        </div>
        <div class="input">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="email" name="email" placeholder="email"><br>
        </div>
        <div class="input">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="passwd" name="passwd" placeholder="Password"><br>
        <div class="input"></div>
        <input type="submit" value="Register"><br>
      </form>
    </div>
  </main>
</body>
<footer>
  <a href="https://www.istockphoto.com/search/2/image-film?phrase=bread&tracked_gsrp_landing=https%3A%2F%2Fwww.istockphoto.com%2Fphotos%2Fbread">Don't Click!!!</a>
</footer>
</html>
